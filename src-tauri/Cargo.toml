[package]
name = "neurobricks-3d"
version = "0.1.0"
description = "3D Neural Network Visual Builder"
authors = ["nanliuqi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "window-start-dragging", "window-minimize", "window-unmaximize", "window-close", "window-show", "window-hide", "window-maximize", "dialog-open", "dialog-save", "fs-read-file", "fs-write-file", "shell-open", "shell-execute"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
csv = "1.3"
encoding_rs = "0.8"
calamine = "=0.22.1"
sysinfo = "=0.29.10"
which = "4.4"
ssh2 = "0.9"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
