<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>训练曲线</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0a1a33; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #e2e8f0; }
  #wrap { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
  #header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; background: #0f3460; user-select: none; }
  #header .title { color: #fff; font-size: 13px; font-weight: 600; }
  #header .hint { color: #94a3b8; font-size: 10px; text-align: right; }
  #body { position: relative; flex: 1; min-height: 0; padding: 8px; }
  canvas { width: 100%; height: 100%; border-radius: 4px; display: block; }
  #message { position: absolute; inset: 8px; display: grid; place-items: center; padding: 20px; color: #94a3b8; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap" data-testid="curve-modal">
  <div id="header">
    <span class="title">训练曲线</span>
    <span class="hint" id="status">正在连接数据…</span>
  </div>
  <div id="body">
    <canvas id="chart" role="img" aria-label="训练曲线"></canvas>
    <div id="message">等待主窗口写入具备明确语义的曲线数据…</div>
  </div>
</div>
<script>
(function () {
  var chartModel = null;
  var canvas = document.getElementById('chart');
  var body = document.getElementById('body');
  var message = document.getElementById('message');
  var statusEl = document.getElementById('status');
  var colors = {
    train_loss: '#60a5fa',
    validation_loss: '#22d3ee',
    train_metric: '#f59e0b',
    validation_metric: '#a3e635'
  };

  function range(values, fixed) {
    if (fixed) return fixed;
    if (!values.length) return { min: 0, max: 1 };
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    if (min === max) {
      var pad = Math.max(Math.abs(min) * 0.1, 0.1);
      return { min: min - pad, max: max + pad };
    }
    var padding = (max - min) * 0.08;
    return { min: min - padding, max: max + padding };
  }

  function drawChart(model) {
    var dpr = window.devicePixelRatio || 1;
    var rect = body.getBoundingClientRect();
    var w = Math.floor(rect.width - 16);
    var h = Math.floor(rect.height - 16);
    if (w <= 0 || h <= 0) return;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#0d2440';
    ctx.fillRect(0, 0, w, h);

    var series = model && Array.isArray(model.series) ? model.series.map(function (item) {
      if (!item || !Array.isArray(item.points)) return null;
      return {
        key: typeof item.key === 'string' ? item.key : 'unknown',
        label: typeof item.label === 'string' ? item.label : '未知序列',
        axis: item.axis === 'loss' ? 'loss' : 'metric',
        points: item.points.filter(function (point) {
          return point && Number.isFinite(point.x) && Number.isFinite(point.epoch) && Number.isFinite(point.value);
        })
      };
    }).filter(function (item) { return item && item.points.length > 0; }) : [];
    if (!series.length) {
      message.style.display = 'grid';
      message.textContent = model && model.warnings && model.warnings.length
        ? model.warnings.join('；')
        : '没有具备明确 split/scope/metricName 与有限数值的数据点。';
      return;
    }
    message.style.display = 'none';

    var padding = { top: 24, right: 54, bottom: 34, left: 54 };
    var plotWidth = Math.max(1, w - padding.left - padding.right);
    var plotHeight = Math.max(1, h - padding.top - padding.bottom);
    var points = [];
    series.forEach(function (item) { points = points.concat(item.points); });
    var xValues = points.map(function (point) { return point.x; }).filter(Number.isFinite);
    var xRange = range(xValues);
    var lossValues = [];
    var metricValues = [];
    series.forEach(function (item) {
      item.points.forEach(function (point) {
        if (!Number.isFinite(point.value)) return;
        (item.axis === 'loss' ? lossValues : metricValues).push(point.value);
      });
    });
    var lossRange = range(lossValues, lossValues.length && lossValues.every(function (value) { return value >= 0; })
      ? { min: 0, max: Math.max.apply(null, lossValues.concat([0.1])) } : null);
    var metricRange = range(metricValues, model.metricName === 'accuracy' ? { min: 0, max: 1 } : null);

    ctx.strokeStyle = '#264a70';
    ctx.lineWidth = 0.5;
    for (var i = 0; i <= 4; i += 1) {
      var gy = padding.top + (plotHeight / 4) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, gy);
      ctx.lineTo(w - padding.right, gy);
      ctx.stroke();
    }

    function toX(value) {
      return padding.left + ((value - xRange.min) / Math.max(xRange.max - xRange.min, 1)) * plotWidth;
    }
    function toY(value, yRange) {
      return padding.top + (1 - ((value - yRange.min) / Math.max(yRange.max - yRange.min, Number.EPSILON))) * plotHeight;
    }

    series.forEach(function (item) {
      var yRange = item.axis === 'loss' ? lossRange : metricRange;
      ctx.strokeStyle = colors[item.key] || '#e2e8f0';
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 2;
      ctx.setLineDash(item.key.indexOf('validation_') === 0 ? [5, 3] : []);
      ctx.beginPath();
      item.points.forEach(function (point, index) {
        var x = toX(point.x);
        var y = toY(point.value, yRange);
        if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        if (item.points.length === 1) {
          ctx.moveTo(x + 3, y);
          ctx.arc(x, y, 3, 0, Math.PI * 2);
        }
      });
      ctx.stroke();
    });
    ctx.setLineDash([]);

    ctx.font = '10px sans-serif';
    var legendX = padding.left;
    series.forEach(function (item) {
      ctx.fillStyle = colors[item.key] || '#e2e8f0';
      ctx.fillRect(legendX, 8, 10, 2);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(item.label, legendX + 14, 12);
      legendX += ctx.measureText(item.label).width + 34;
    });
  }

  window.addEventListener('resize', function () { drawChart(chartModel); });
  var CHART_KEY = 'nb_chart_metrics';
  var lastRaw = '';

  function setStatus(payload) {
    if (!statusEl) return;
    var generated = new Date(payload.generatedAt);
    var summaries = payload.chart.series.map(function (item) {
      var latest = item.points[item.points.length - 1];
      if (!latest || !Number.isFinite(latest.value)) return item.label + '：不可用';
      var text = item.axis === 'metric' && payload.chart.metricName === 'accuracy'
        ? (latest.value * 100).toFixed(1) + '%'
        : latest.value.toFixed(6);
      return item.label + '：' + text;
    });
    statusEl.textContent = payload.chart.pointCount + ' 个可解释点 · '
      + generated.toLocaleTimeString('zh-CN', { hour12: false })
      + ' · ' + (payload.chart.metricValueMode === 'strict' ? '严格指标值' : '诊断兼容值')
      + ' · ' + summaries.join(' / ');
  }

  function pollData() {
    try {
      var raw = localStorage.getItem(CHART_KEY);
      if (!raw) {
        statusEl.textContent = '等待训练数据…';
        return;
      }
      if (raw === lastRaw) return;
      lastRaw = raw;
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 2 || !parsed.chart) {
        chartModel = null;
        message.style.display = 'grid';
        message.textContent = '检测到旧版或损坏的曲线数据。请从主窗口重新点击“独立窗口查看”。';
        statusEl.textContent = '曲线协议不兼容';
        drawChart(null);
        return;
      }
      chartModel = parsed.chart;
      setStatus(parsed);
      drawChart(chartModel);
    } catch (error) {
      chartModel = null;
      message.style.display = 'grid';
      message.textContent = '曲线数据无法解析；请从主窗口重新打开。';
      statusEl.textContent = '曲线数据异常';
      drawChart(null);
    }
  }

  pollData();
  setInterval(pollData, 500);
  drawChart(chartModel);
})();
</script>
</body>
</html>
